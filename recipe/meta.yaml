{% set name = "intervaltree" %}
{% set version = "3.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f3f7e8baeb7dd75b9f7a6d33cf3ec10025984a8e66e3016d537e52130c73cfe2

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  skip: true  # [py<35]

requirements:
  host:
    - pip
    - python
    - hatchling
    - uv-dynamic-versioning
  run:
    - python
    - sortedcontainers

test:
  imports:
    - intervaltree
  source_files:
    - test/
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v test/

about:
  home: https://github.com/chaimleib/intervaltree
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: A mutable, self-balancing interval tree.
  description: |
    A mutable, self-balancing interval tree for Python 2 and 3.
    Queries may be by point, by range overlap, or by range envelopment.
    This library was designed to allow tagging text and time intervals,
    where the intervals include the lower bound but not the upper bound.
  dev_url: https://github.com/chaimleib/intervaltree
  doc_url: https://github.com/chaimleib/intervaltree

extra:
  recipe-maintainers:
    - johanneskoester
    - bgruening
