{% set version = "3.2.1" %}

package:
  name: intervaltree
  version: {{ version }}

source:
  fn: intervaltree-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/i/intervaltree/intervaltree-{{ version }}.tar.gz
  sha256: f3f7e8baeb7dd75b9f7a6d33cf3ec10025984a8e66e3016d537e52130c73cfe2

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  skip: true  # [py<2718]

requirements:
  host:
    - pip
    - python
    - hatchling
    - uv-dynamic-versioning
  run:
    - python
    - sortedcontainers

test:
  imports:
    - intervaltree

about:
  home: https://github.com/chaimleib/intervaltree
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Editable interval tree data structure for Python 2 and 3
  license_family: APACHE

extra:
  recipe-maintainers:
    - johanneskoester
    - bgruening
